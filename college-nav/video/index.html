<style>
:root{--ink:#3f3550;--p:#82689d;--pd:#5d4a73;--g:#d8b579;--gi:#e6d9a8;--bg:#2f2640}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:#fff;font-family:'Noto Sans TC',sans-serif;letter-spacing:.04em;-webkit-font-smoothing:antialiased}
body{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;position:relative;overflow-x:hidden;isolation:isolate}
body::before{content:"";position:fixed;inset:-60px;background:url(../media/promo-wide-poster.jpg) center/cover;filter:blur(44px) saturate(1.2);opacity:.5;z-index:-2}
body::after{content:"";position:fixed;inset:0;background:radial-gradient(1000px 600px at 15% 0%,rgba(130,104,157,.35),transparent 60%),linear-gradient(180deg,rgba(47,38,64,.55),rgba(47,38,64,.85));z-index:-1}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px max(16px,env(safe-area-inset-left)) 8px;max-width:1320px;width:100%;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none}
.brand svg{width:26px;height:26px}
.brand b{display:block;font-family:'Cactus Classical Serif',serif;font-weight:400;font-size:18px;letter-spacing:.12em;line-height:1.2}
.brand small{display:block;font-size:10px;letter-spacing:.3em;color:var(--gi)}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:8px 16px 28px}
.v{width:min(1240px,100%,calc((100dvh - 300px) * 16 / 9));aspect-ratio:16/9}
.v.tall{width:min(440px,100%,calc((100dvh - 300px) * 9 / 16));aspect-ratio:9/16}
.v video{display:block;width:100%;height:100%;border-radius:20px;background:#1f1a2b;box-shadow:0 30px 70px rgba(0,0,0,.4)}
.txt{text-align:center;max-width:640px}
.eyebrow{font-size:12px;letter-spacing:.3em;color:var(--gi)}
h1{font-family:'Cactus Classical Serif',serif;font-weight:400;font-size:clamp(24px,3.2vw,34px);letter-spacing:.1em;margin:6px 0 4px}
.sig{font-family:'Pinyon Script',cursive;font-size:26px;color:#d9cbe9;letter-spacing:0}
.btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:11px 22px;border-radius:999px;font-size:15px;text-decoration:none;cursor:pointer;border:1px solid transparent;font-family:inherit;letter-spacing:.08em}
.btn.pri{background:#fff;color:var(--pd)}
.btn.pri:hover{background:#f4f0f8}
.btn.gh{background:transparent;color:#fff;border-color:rgba(255,255,255,.4)}
.btn.gh:hover{background:rgba(255,255,255,.1)}
footer{text-align:center;font-size:12px;color:rgba(255,255,255,.55);padding:0 16px 22px;letter-spacing:.2em}
@media (max-width:640px){main{padding:4px 0 24px}.v,.v.tall{width:100%}.v video{border-radius:0}.txt{padding:0 16px}}
</style>
</head>
<body>
<header>
  <a class="brand" href="../">
    <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M20 2 31 20 20 38 9 20Z" fill="#c9bbdb"/><path d="M20 2 31 20 20 20Z" fill="#a38fbb"/><path d="M20 20 31 20 20 38Z" fill="#d8b579"/></svg>
    <span><b>升學導航</b><small>VALERIE YU STUDIO</small></span>
  </a>
</header>
<main>
  <div class="v" id="box"><video id="vid" controls controlsList="nodownload noplaybackrate" disablepictureinpicture playsinline preload="metadata"></video></div>
  <div class="txt">
    <div class="eyebrow">VIDEO · 1 分鐘認識</div>
    <h1>一分鐘認識升學導航</h1>
    <div class="sig">Find the value of you!</div>
    <div class="btns">
      <a class="btn pri" href="../">進入升學導航 →</a>
      <button class="btn gh" type="button" id="sw"></button>
    </div>
  </div>
</main>
<footer>VALERIE YU STUDIO</footer>
<script>
(function(){
  var vid=document.getElementById('vid'),box=document.getElementById('box'),sw=document.getElementById('sw'),cur=null,manual=false;
  function set(tall){
    if(cur===tall)return; cur=tall;
    var n=tall?'promo':'promo-wide';
    vid.poster='../media/'+n+(tall?'-poster':'-poster')+'.jpg';
    vid.src='../media/'+n+'.mp4';
    box.className='v'+(tall?' tall':'');
    sw.textContent=tall?'看橫式版':'看直式版';
  }
  function auto(){ if(manual||(!vid.paused&&vid.currentTime>0))return; set(!(window.matchMedia&&matchMedia('(min-width: 760px) and (orientation: landscape)').matches)); }
  sw.onclick=function(){manual=true;var t=vid.currentTime,p=!vid.paused;set(!cur);if(t){vid.addEventListener('loadedmetadata',function f(){vid.removeEventListener('loadedmetadata',f);vid.currentTime=t;if(p)vid.play();});}};
  auto(); addEventListener('resize',auto);
})();
</script>
<script>['contextmenu','dragstart'].forEach(function(ev){document.addEventListener(ev,function(e){e.preventDefault();});});</script>
</body>
